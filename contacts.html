    <h1 style="text-align: center;">Записаться в салон</h1>

        <div class="contacts-info">
            <h2>Наш адрес</h2>
            <p>ул. Красоты, дом 15, офис 3</p>
            <h2>Телефон</h2>
            <p>+996 774 070 724</p>

            </h2>
        </div>

        
        <form id="appointment-form" class="contacts-form">

            <input type="tel" id="user-phone" placeholder="Ваш телефон" required>

                <option value="Маникюр">Классический маникюр</option>
                <option value="Педикюр">СПА-Педикюр</option>
            </select>

            <input type="date" id="appointment-date" required>

            <button type="submit" class="btn-order">Отправить заявку</button>
        </form>

    </div>
